version: 1
name: alpha
repository:
  source: ./repo-alpha
  default_branch: main
default_production_line: f
worktrees:
  root: "<stop-root>/worktrees-alpha"
rooms:
  eng:
    stations:
      hold:
        model: probe/busy
        isolation: worktree
        instances: 2
        extensions:
          - path: "<repo>/docs/evidence/rpc-54-4-linux/probe-extension.ts"
            tools: [probe_hold]
production_lines:
  f:
    verify: ["true"]
    stages:
      - id: a
        station: eng.hold
        writing: true
      - id: b
        station: eng.hold
        approval: true
        on_rejection: a
